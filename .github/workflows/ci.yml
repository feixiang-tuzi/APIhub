name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    # 英文版 Windows runner 默认 cp1252，脚本里的中文输出会 UnicodeEncodeError。
    # 显式指定 UTF-8，与代码内的 stdout.reconfigure 形成双保险。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show versions
        run: |
          python --version
          node --version

      - name: Syntax check (server.py)
        run: python -m py_compile server.py

      - name: Run backend self-test
        run: python tests/selftest.py

      - name: Syntax check (web/app.js)
        run: node --check web/app.js

      - name: Run smartparse tests
        run: node tests/smartparse.test.js

      - name: Run custom-order regression tests
        run: node tests/order.test.js
